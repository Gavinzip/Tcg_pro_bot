name: Event leaderboard regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  event-leaderboards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install python-dotenv requests
      - name: Verify scanner, evidence storage and authenticated HTTP contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -m unittest
          tests.test_event_replay
          tests.test_event_query_retention
          tests.test_event_leaderboard_scanner
          tests.test_event_leaderboard_store
          tests.test_event_builder_scope
          tests.test_event_checkout_evidence
          tests.test_event_provider_errors
          tests.test_event_provider_retries
          tests.test_event_scan_diagnostics
          tests.test_event_boundary_search
          tests.test_event_boundary_recovery
          tests.test_event_response_evidence
          tests.test_event_integer_contract
          tests.test_event_verification_concurrency
          tests.test_event_http_pool
          tests.test_event_rate_recovery
          tests.test_profile_api_auth
          tests.test_profile_activity_routes
          tests.test_production_jobs
          tests.test_backup_scan_priority
          tests.test_bbw_checkout_events
          tests.test_bbw_bounded_migration
          -v
      - name: Install local encrypted-backup test dependency
        run: sudo apt-get update -qq && sudo apt-get install -y restic
      - name: Verify encrypted backup and isolated restore
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          TCG_BACKUP_TEST_ROOT: ${{ runner.temp }}/backup-priority-roundtrip
          TCG_BACKUP_TEST_RESTIC: /usr/bin/restic
        run: python -m unittest tests.test_drive_backup -v
